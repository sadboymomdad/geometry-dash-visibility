name: Build macOS Geode mod

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build for macOS
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: MacOS
          sdk: given
      - name: Upload .geode package
        uses: actions/upload-artifact@v4
        with:
          name: Gameplay-Visibility-macOS
          path: ${{ steps.build.outputs.build-output }}/*.geode
